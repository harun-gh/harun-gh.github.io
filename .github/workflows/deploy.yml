name: Deploy SvelteKit with Bun

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Cache SvelteKit build
        uses: actions/cache@v5
        with:
          path: |
            .svelte-kit
            build
          key: ${{ runner.os }}-sveltekit-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**.[jt]s', '**/+*.svelte') }}
          restore-keys: |
            ${{ runner.os }}-sveltekit-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-sveltekit-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4